name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Backfill this existing release tag with the build artifacts"
        required: false
        type: string

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: remotion-compositions
      - run: python -m pip install -r backend/agent/requirements.txt
      - run: python -m pip install pytest==9.2.0 pytest-asyncio==1.5.0 mypy==1.18.2 ruff==0.15.17
      - run: ruff check --isolated app tests
        working-directory: backend/agent
      - run: mypy app --ignore-missing-imports --follow-imports=silent
        working-directory: backend/agent
      - run: python -m pytest -q
        working-directory: backend/agent

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/gateway/pom.xml
      - run: mvn -B test
        working-directory: backend/gateway

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run test:coverage
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun run verify:local-python
        working-directory: frontend
      - run: bun run build
        working-directory: frontend

  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - run: node --check main.mjs && node --check server.mjs && node --check services.mjs && node --check sidecar-builder.cjs && for file in scripts/*.mjs; do node --check "$file"; done
        working-directory: desktop
      - run: npm run prepare-dist
        working-directory: desktop
      - run: npm run verify:runtime
        working-directory: desktop
      - run: node --test tests/*.test.mjs
        working-directory: desktop
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Build Gateway with Maven retries
        run: |
          for attempt in 1 2 3; do
            mvn -B -DskipTests package && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
        working-directory: backend/gateway
      - run: npm run prepare:sidecar
        working-directory: desktop
      - run: ALGOCOACH_SERVICE_ROOT="$PWD/sidecar-stage" npm run verify:services
        working-directory: desktop
      - run: ALGOCOACH_SERVICE_ROOT="$PWD/sidecar-stage" npm run verify:conversation
        working-directory: desktop
      - run: npm run package:linux:sidecar
        working-directory: desktop
      - run: npm run verify:packaged-python
        working-directory: desktop
      - run: APPIMAGE_EXTRACT_AND_RUN=1 ALGOCOACH_DESKTOP_BINARY="$PWD/dist/算法练习室-0.2.0.AppImage" npm run verify:packaged-python
        working-directory: desktop
      - run: npm run verify:linux
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: algo-coach-linux-x64
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  desktop-macos-arm64:
    # macos-15 is the current GitHub-hosted Apple Silicon runner label.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: mvn -B -DskipTests package
        working-directory: backend/gateway
      - run: npm run prepare:sidecar
        working-directory: desktop
      - run: ALGOCOACH_SERVICE_ROOT="$PWD/sidecar-stage" npm run verify:services
        working-directory: desktop
      - run: ALGOCOACH_SERVICE_ROOT="$PWD/sidecar-stage" npm run verify:conversation
        working-directory: desktop
      - run: npm run package:mac:sidecar
        working-directory: desktop
      - run: npm run verify:mac:arm64
        working-directory: desktop
      - run: npm run verify:mac:sidecar
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: algo-coach-macos-arm64
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  remotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
        working-directory: remotion-compositions
      - run: bun run build
        working-directory: remotion-compositions

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [desktop-contract, desktop-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: algo-coach-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No desktop assets were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "AlgoCoach $RELEASE_TAG" --generate-notes
          fi
